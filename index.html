<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDOCRINE: MULTIPLAYER</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap');

        :root {
            --bg-color: #050b14;
            --neon-blue: #00e5ff;
            --neon-red: #ff1744;
            --neon-green: #00e676;
            --neon-yellow: #ffea00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: #fff; overflow: hidden; width: 100vw; height: 100vh; font-family: 'Rajdhani', 'Sarabun', sans-serif; user-select: none; }
        
        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; }

        .btn { padding: 15px 30px; margin: 10px; background: rgba(0,0,0,0.5); color: var(--neon-blue); border: 2px solid var(--neon-blue); font-family: 'Orbitron', sans-serif; font-size: 1.2rem; cursor: pointer; border-radius: 5px; }
        .btn:hover { background: var(--neon-blue); color: #000; }
        .btn-small { padding: 5px 15px; font-size: 1.5rem; margin: 0 10px; width: 50px; height: 50px; }

        /* ส่วนอื่นๆ ซ่อนไว้เพื่อความกระชับในโค้ด UI */
        .settings-panel { margin-top: 20px; padding: 15px; background: rgba(0, 230, 118, 0.1); border: 1px solid var(--neon-green); border-radius: 5px; text-align: center;}
    </style>
</head>
<body>

    <!-- Main Menu -->
    <div id="main-menu" class="screen active">
        <h1 style="font-size: 3.5rem; color: var(--neon-blue); text-align: center; font-family: 'Orbitron', sans-serif;">ENDOCRINE</h1>
        <button class="btn" onclick="gotoHost()">HOST GAME (สร้างห้อง)</button>
        <button class="btn" onclick="gotoJoin()">JOIN GAME (เข้าห้อง)</button>
    </div>

    <!-- Host Lobby -->
    <div id="lobby-host" class="screen">
        <h2 style="color: var(--neon-yellow);">HOSTING ROOM</h2>
        <div style="margin: 20px; padding: 30px; border: 1px solid var(--neon-blue); text-align: center;">
            <p>ROOM CODE:</p>
            <h1 id="host-room-code" style="font-size: 4rem; color: var(--neon-green);">----</h1>
            <p id="host-status">INITIALIZING SERVER...</p>
            
            <div class="settings-panel">
                <p>BOARD SIZE (จำนวนช่อง)</p>
                <div style="display: flex; justify-content: center; align-items: center; margin-top: 10px;">
                    <button class="btn btn-small" onclick="adjustBoardSize(-10)">-</button>
                    <span id="display-board-size" style="font-size: 2.5rem; width: 100px; color: var(--neon-yellow);">100</span>
                    <button class="btn btn-small" onclick="adjustBoardSize(10)">+</button>
                </div>
            </div>
        </div>
        <button class="btn" onclick="location.reload()">BACK TO MENU</button>
    </div>

    <!-- Join Lobby -->
    <div id="lobby-join" class="screen">
        <h2>JOIN ROOM</h2>
        <div style="margin: 20px; padding: 30px; border: 1px solid var(--neon-blue); text-align: center;">
            <p>ENTER 4-DIGIT CODE:</p>
            <input type="text" id="input-room-code" maxlength="4" style="margin: 15px 0; padding: 15px; font-size: 2rem; text-align: center; width: 200px;">
        </div>
        <button class="btn" onclick="location.reload()">BACK TO MENU</button>
    </div>

<script>
    let hostBoardSpaces = 100;

    // ฟังก์ชันเปลี่ยนหน้าจอ (แยกออกจากการเชื่อมต่อเน็ต เพื่อให้กดติดเสมอ)
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // เมื่อกดปุ่ม Host
    function gotoHost() {
        showScreen('lobby-host');
        // สุ่มรหัสห้องให้เลยทันทีที่เข้าหน้า Host
        document.getElementById('host-room-code').innerText = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('host-status').innerText = "ONLINE! WAITING FOR PLAYERS...";
    }

    // เมื่อกดปุ่ม Join
    function gotoJoin() {
        showScreen('lobby-join');
    }

    // ฟังก์ชันเพิ่มลดจำนวนข้อ
    function adjustBoardSize(amount) {
        let newSize = hostBoardSpaces + amount;
        if (newSize >= 10 && newSize <= 500) { 
            hostBoardSpaces = newSize;
            document.getElementById('display-board-size').innerText = hostBoardSpaces;
        }
    }
</script>
</body>
</html>
